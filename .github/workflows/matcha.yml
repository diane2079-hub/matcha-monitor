name: matcha-monitor

on:
  schedule:
    - cron: "*/5 * * * *"
  workflow_dispatch:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install requests
      - run: python matcha_check.py
        env:
          NTFY_TOPIC: ${{ secrets.NTFY_TOPIC }}
          IS_TEST: ${{ github.event_name == 'workflow_dispatch' }}
